<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f4f5f7;
      color: #1d1d1f;
    }
    header {
      background: #fff;
      padding: 24px 32px;
      border-bottom: 1px solid #e2e2e2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; }
    .summary { display: flex; gap: 24px; font-size: 14px; color: #555; }
    .summary b { font-size: 18px; color: #1d1d1f; display: block; }
    .status { font-size: 12px; color: #666; margin-top: 6px; }
    .status.live { color: #1a9e57; }
    .status.fallback { color: #b7791f; }
    main { padding: 24px 32px; max-width: 1000px; margin: 0 auto; }
    .add-account {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      border: 1px solid #e2e2e2;
    }
    .add-account h2 { margin-top: 0; font-size: 16px; }
    #account-form { display: flex; gap: 10px; flex-wrap: wrap; }
    select, input, button {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #2d6cdf;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #1f54b3; }
    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .account-card {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      position: relative;
    }
    .account-card:hover { border-color: #2d6cdf; }
    .platform-badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #eef2fb;
      color: #2d6cdf;
      margin-bottom: 8px;
    }
    .account-handle { font-weight: 600; margin-bottom: 4px; }
    .account-count { font-size: 26px; font-weight: 700; }
    .account-delta { font-size: 13px; }
    .delta-up { color: #1a9e57; }
    .delta-down { color: #d23b3b; }
    .delta-flat { color: #888; }
    .account-empty { color: #999; font-size: 13px; }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      color: #bbb;
      font-size: 16px;
      padding: 0 4px;
      border: none;
      cursor: pointer;
    }
    .delete-btn:hover { color: #d23b3b; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      width: 90%;
      max-width: 520px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      color: #999;
      font-size: 20px;
      border: none;
      cursor: pointer;
    }
    .modal-close:hover { color: #333; }
    #snapshot-form { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Social Media Tracker</h1>
      <div id="status" class="status">Connecting to tracker API…</div>
    </div>
    <div id="summary" class="summary"></div>
  </header>

  <main>
    <section class="add-account">
      <h2>Add Account</h2>
      <form id="account-form">
        <select id="platform" required>
          <option value="" disabled selected>Platform</option>
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
          <option value="youtube">YouTube</option>
          <option value="linkedin">LinkedIn</option>
          <option value="facebook">Facebook</option>
          <option value="other">Other</option>
        </select>
        <input type="text" id="handle" placeholder="@handle or channel name" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2>Accounts</h2>
      <div id="accounts" class="accounts-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <h2 id="modal-title"></h2>
      <canvas id="chart" height="200"></canvas>
      <form id="snapshot-form">
        <input type="number" id="follower-count" min="0" placeholder="Follower count" required>
        <input type="date" id="recorded-date">
        <button type="submit">Log</button>
      </form>
    </div>
  </div>

  <script>
    const accountsEl = document.getElementById("accounts");
    const summaryEl = document.getElementById("summary");
    const statusEl = document.getElementById("status");
    const accountForm = document.getElementById("account-form");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modal-title");
    const modalClose = document.getElementById("modal-close");
    const snapshotForm = document.getElementById("snapshot-form");
    const followerCountInput = document.getElementById("follower-count");
    const recordedDateInput = document.getElementById("recorded-date");

    let activeAccountId = null;
    let chartInstance = null;
    let accounts = [];
    let snapshots = {};
    let usingLiveApi = false;

    const ACCOUNTS_KEY = "smTracker_accounts";
    const SNAPSHOTS_KEY = "smTracker_snapshots";
    const DEFAULT_DATA = {
      accounts: [
        { id: 1, platform: "instagram", handle: "@ataasoulami", created_at: "2026-06-16" },
        { id: 2, platform: "tiktok", handle: "@ataasoulami", created_at: "2026-06-16" },
        { id: 3, platform: "youtube", handle: "@ataasoulami", created_at: "2026-06-16" },
        { id: 4, platform: "linkedin", handle: "@ataasoulami", created_at: "2026-06-16" },
        { id: 5, platform: "facebook", handle: "@ataasoulami", created_at: "2026-06-16" }
      ],
      snapshots: {
        1: [
          { recorded_at: "2026-06-16", follower_count: 116000 },
          { recorded_at: "2026-06-24", follower_count: 117000 },
          { recorded_at: "2026-06-30", follower_count: 118000 }
        ],
        2: [
          { recorded_at: "2026-06-16", follower_count: 32400 },
          { recorded_at: "2026-06-24", follower_count: 32400 },
          { recorded_at: "2026-06-30", follower_count: 32400 }
        ],
        3: [
          { recorded_at: "2026-06-16", follower_count: 13600 },
          { recorded_at: "2026-06-24", follower_count: 14100 },
          { recorded_at: "2026-06-30", follower_count: 14300 }
        ],
        4: [
          { recorded_at: "2026-06-16", follower_count: 6000 },
          { recorded_at: "2026-06-24", follower_count: 6095 },
          { recorded_at: "2026-06-30", follower_count: 6147 }
        ],
        5: [
          { recorded_at: "2026-06-16", follower_count: 28000 },
          { recorded_at: "2026-06-24", follower_count: 28000 },
          { recorded_at: "2026-06-30", follower_count: 29000 }
        ]
      }
    };

    const API_BASE = (window.TRACKER_API_BASE_URL || "").trim().replace(/\/$/, "") ||
      (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://127.0.0.1:8000"
        : window.location.origin);

    function setStatus(message, isLive) {
      statusEl.textContent = message;
      statusEl.className = `status ${isLive ? "live" : "fallback"}`;
    }

    function fmt(n) {
      return n === null || n === undefined ? "--" : n.toLocaleString();
    }

    function saveData() {
      localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
      localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(snapshots));
    }

    function initData() {
      const storedAccounts = localStorage.getItem(ACCOUNTS_KEY);
      const storedSnapshots = localStorage.getItem(SNAPSHOTS_KEY);
      if (storedAccounts && storedSnapshots) {
        accounts = JSON.parse(storedAccounts);
        snapshots = JSON.parse(storedSnapshots);
        return;
      }
      accounts = DEFAULT_DATA.accounts.map((acc) => ({ ...acc }));
      snapshots = Object.fromEntries(
        Object.entries(DEFAULT_DATA.snapshots).map(([id, entries]) => [id, entries.map((entry) => ({ ...entry }))])
      );
      saveData();
    }

    async function requestJson(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
      if (!response.ok) {
        throw new Error(data.error || data.message || "Request failed");
      }
      return data;
    }

    async function loadFromApi() {
      try {
        const serverAccounts = await requestJson("/api/accounts");
        accounts = serverAccounts.map((acc) => ({
          id: acc.id,
          platform: acc.platform,
          handle: acc.handle,
          created_at: acc.created_at,
        }));
        snapshots = {};
        for (const acc of accounts) {
          const rows = await requestJson(`/api/accounts/${acc.id}/snapshots`);
          snapshots[acc.id] = rows;
        }
        saveData();
        usingLiveApi = true;
        setStatus("Live syncing with tracker API", true);
        refresh();
      } catch (err) {
        usingLiveApi = false;
        setStatus("Using local browser fallback. Set TRACKER_API_BASE_URL to a live backend URL to sync online.", false);
        initData();
        refresh();
      }
    }

    function loadSummary() {
      let total = 0;
      let total_delta = 0;
      accounts.forEach((acc) => {
        const accSnapshots = snapshots[acc.id] || [];
        if (accSnapshots.length > 0) {
          total += accSnapshots[accSnapshots.length - 1].follower_count;
          if (accSnapshots.length > 1) {
            total_delta += accSnapshots[accSnapshots.length - 1].follower_count - accSnapshots[accSnapshots.length - 2].follower_count;
          }
        }
      });
      summaryEl.innerHTML = `
        <div><b>${fmt(total)}</b>Total followers</div>
        <div><b>${accounts.length}</b>Accounts tracked</div>
        <div><b>${total_delta >= 0 ? "+" : ""}${fmt(total_delta)}</b>Change since last log</div>
      `;
    }

    function deltaClass(delta) {
      if (delta === null || delta === undefined) return "delta-flat";
      if (delta > 0) return "delta-up";
      if (delta < 0) return "delta-down";
      return "delta-flat";
    }

    function deltaText(delta) {
      if (delta === null || delta === undefined) return "";
      if (delta === 0) return "no change";
      return `${delta > 0 ? "+" : ""}${delta.toLocaleString()} since last log`;
    }

    function loadAccounts() {
      accountsEl.innerHTML = "";
      if (accounts.length === 0) {
        accountsEl.innerHTML = '<p class="account-empty">No accounts yet. Add one above.</p>';
        return;
      }
      accounts.forEach((acc) => {
        const accSnapshots = snapshots[acc.id] || [];
        const latest = accSnapshots.length > 0 ? accSnapshots[accSnapshots.length - 1] : null;
        const previous = accSnapshots.length > 1 ? accSnapshots[accSnapshots.length - 2] : null;
        const delta = latest && previous ? latest.follower_count - previous.follower_count : null;
        const card = document.createElement("div");
        card.className = "account-card";
        card.innerHTML = `
          <button class="delete-btn" data-id="${acc.id}" title="Remove account">&times;</button>
          <div class="platform-badge">${acc.platform}</div>
          <div class="account-handle">${acc.handle}</div>
          ${
            latest
              ? `<div class="account-count">${fmt(latest.follower_count)}</div>
                 <div class="account-delta ${deltaClass(delta)}">${deltaText(delta)}</div>`
              : '<div class="account-empty">No data logged yet</div>'
          }
        `;
        card.addEventListener("click", (e) => {
          if (e.target.classList.contains("delete-btn")) return;
          openModal(acc);
        });
        accountsEl.appendChild(card);
      });
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm("Remove this account and all its history?")) return;
          const id = parseInt(btn.dataset.id, 10);
          try {
            if (usingLiveApi) {
              await requestJson(`/api/accounts/${id}`, { method: "DELETE" });
            }
          } catch (err) {
            console.warn(err);
          }
          accounts = accounts.filter((a) => a.id !== id);
          delete snapshots[id];
          saveData();
          refresh();
        });
      });
    }

    function refresh() {
      loadAccounts();
      loadSummary();
    }

    accountForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const platform = document.getElementById("platform").value;
      const handle = document.getElementById("handle").value.trim();
      if (!platform || !handle) return;
      try {
        if (usingLiveApi) {
          const created = await requestJson("/api/accounts", {
            method: "POST",
            body: JSON.stringify({ platform, handle }),
          });
          accounts.push({
            id: created.id,
            platform: created.platform,
            handle: created.handle,
            created_at: created.created_at,
          });
          snapshots[created.id] = [];
          saveData();
        } else {
          const id = Date.now();
          accounts.push({ id, platform, handle, created_at: new Date().toISOString().split("T")[0] });
          snapshots[id] = [];
          saveData();
        }
      } catch (err) {
        console.warn(err);
      }
      accountForm.reset();
      refresh();
    });

    function openModal(acc) {
      activeAccountId = acc.id;
      modalTitle.textContent = `${acc.platform} — ${acc.handle}`;
      const accSnapshots = snapshots[acc.id] || [];
      const latest = accSnapshots.length > 0 ? accSnapshots[accSnapshots.length - 1] : null;
      followerCountInput.value = latest ? latest.follower_count : "";
      recordedDateInput.value = new Date().toISOString().slice(0, 10);
      modal.classList.remove("hidden");
      renderChart(acc.id);
    }

    modalClose.addEventListener("click", () => {
      modal.classList.add("hidden");
      activeAccountId = null;
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
        activeAccountId = null;
      }
    });

    snapshotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeAccountId) return;
      const follower_count = parseInt(followerCountInput.value, 10);
      const recorded_at = recordedDateInput.value || new Date().toISOString().slice(0, 10);
      if (Number.isNaN(follower_count) || follower_count < 0) return;
      try {
        if (usingLiveApi) {
          await requestJson(`/api/accounts/${activeAccountId}/snapshots`, {
            method: "POST",
            body: JSON.stringify({ follower_count, recorded_at }),
          });
          const rows = await requestJson(`/api/accounts/${activeAccountId}/snapshots`);
          snapshots[activeAccountId] = rows;
        } else {
          if (!snapshots[activeAccountId]) snapshots[activeAccountId] = [];
          const existingIndex = snapshots[activeAccountId].findIndex((s) => s.recorded_at === recorded_at);
          if (existingIndex >= 0) {
            snapshots[activeAccountId][existingIndex].follower_count = follower_count;
          } else {
            snapshots[activeAccountId].push({ follower_count, recorded_at });
          }
          snapshots[activeAccountId].sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));
        }
        saveData();
        renderChart(activeAccountId);
        refresh();
      } catch (err) {
        console.warn(err);
      }
    });

    function renderChart(accountId) {
      const accSnapshots = snapshots[accountId] || [];
      const labels = accSnapshots.map((s) => s.recorded_at);
      const data = accSnapshots.map((s) => s.follower_count);
      if (chartInstance) chartInstance.destroy();
      const ctx = document.getElementById("chart").getContext("2d");
      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{ label: "Followers", data, borderColor: "#2d6cdf", backgroundColor: "rgba(45,108,223,0.1)", tension: 0.25, fill: true }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false } } },
      });
    }

    loadFromApi();
  </script>
</body>
</html>
